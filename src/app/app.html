<div class="layout">
  <!-- Mobile top bar -->
  <header class="mobile-bar">
    <button class="hamburger" (click)="toggleSidebar()" [attr.aria-expanded]="sidebarOpen()" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </button>
    <a class="mobile-brand" routerLink="/" (click)="closeSidebar()">
      <svg viewBox="0 0 64 64" width="20" height="20" aria-hidden="true">
        <defs>
          <linearGradient id="lg-m" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3ecf8e"/>
            <stop offset="1" stop-color="#1e6e4a"/>
          </linearGradient>
        </defs>
        <path fill="url(#lg-m)" d="M37 2 6 38h22L27 62l31-36H36z"/>
      </svg>
      <strong>ngx-saqly-supabase</strong>
    </a>
    <button class="theme-toggle theme-toggle--mobile" (click)="toggleTheme()" [attr.aria-label]="theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'">
      @if (theme() === 'dark') {
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      }
    </button>
  </header>

  <!-- Sidebar overlay (mobile) -->
  <div class="sidebar-overlay" [class.open]="sidebarOpen()" (click)="closeSidebar()"></div>

  <aside class="sidebar" [class.open]="sidebarOpen()">
    <div class="sidebar-header">
      <a class="brand" routerLink="/" (click)="closeSidebar()">
        <span class="brand-logo">
          <svg viewBox="0 0 64 64" width="28" height="28" aria-hidden="true">
            <defs>
              <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#3ecf8e"/>
                <stop offset="1" stop-color="#1e6e4a"/>
              </linearGradient>
            </defs>
            <path fill="url(#lg)" d="M37 2 6 38h22L27 62l31-36H36z"/>
          </svg>
        </span>
        <span class="brand-text">
          <strong>ngx-saqly-supabase</strong>
          <small>v1 · docs</small>
        </span>
      </a>
      <button class="theme-toggle" (click)="toggleTheme()" [attr.aria-label]="theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'">
        @if (theme() === 'dark') {
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        }
      </button>
    </div>

    <input class="sidebar-search" type="search" placeholder="Search docs…" [ngModel]="search()" (ngModelChange)="onSearch($event)" />

    @for (group of filteredGroups(); track group.title) {
      <div class="sidebar-group">
        <div class="sidebar-group-title">{{ group.title }}</div>
        @for (item of group.items; track item.path) {
          <a
            class="sidebar-link"
            [routerLink]="item.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.path === '/' }"
            (click)="closeSidebar()">
            <span class="dot"></span>
            <span>{{ item.label }}</span>
            @if (item.tag) { <span class="tag" [class.tag-warn]="item.tag === 'demo'">{{ item.tag }}</span> }
          </a>
        }
      </div>
    }

    <div class="sidebar-foot">
      <a href="https://www.npmjs.com/package/ngx-saqly-supabase" target="_blank" rel="noopener">npm</a>
      <span>·</span>
      <a href="https://supabase.com" target="_blank" rel="noopener">supabase</a>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
