name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build -- --configuration production

      - name: Prepare dist for Pages
        run: |
          OUT_DIR=$(find dist -maxdepth 3 -type d -name browser | head -n 1)
          if [ -z "$OUT_DIR" ]; then
            OUT_DIR=$(ls -d dist/*/ | head -n 1)
          fi
          echo "Publishing $OUT_DIR"
          cp "$OUT_DIR/index.html" "$OUT_DIR/404.html"
          echo "PAGES_DIR=$OUT_DIR" >> $GITHUB_ENV

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGES_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
